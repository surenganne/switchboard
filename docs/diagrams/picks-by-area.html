<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picks by task area</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #F5F5F5; color: #0A2540; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: ui-monospace, monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase;
               color: #5f6b7a; margin-bottom: 0.5rem; }
    h1 { font-family: Georgia, serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
